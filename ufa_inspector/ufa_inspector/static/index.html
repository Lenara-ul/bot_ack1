<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Оформление акта — ЦОБ г. Уфа</title><link rel="stylesheet" href="style.css"></head>
<body>
<header><b>Центр общественной безопасности г. Уфа</b>
  <nav><a href="/" class="on">Новый акт</a><a href="registry.html">Реестр актов</a></nav></header>
<main>
<section class="card">
  <h2>1. Фото нарушения</h2>
  <input type="file" id="file" accept="image/*" hidden>
  <button class="btn" id="pick">Загрузить фото</button>
  <div class="grid2">
    <img id="preview" alt="" hidden>
    <div id="recog" hidden>
      <h3>Результаты распознавания</h3>
      <p class="hint">Демо-данные (mock). Здесь будет интеграция с OCR API. Проверьте и поправьте поля ниже.</p>
      <p id="dtsrc" class="hint"></p><p id="gps" class="hint"></p>
    </div>
  </div>
</section>

<section class="card" id="formcard">
  <h2>2. Данные акта <small id="editing"></small></h2>
  <div class="form">
    <label>Госномер <input id="plate" placeholder="А123ВС102" autocomplete="off"></label>
    <label>Дата <input id="date" type="date"></label>
    <label>Время <input id="time" type="time"></label>
    <label class="wide">Место (адрес / ориентир) <input id="address" placeholder="ул. Ленина, 10, у 2-го подъезда"></label>
    <label class="wide">Нарушение <select id="violation"></select></label>
    <div class="wide norms" id="norms">Нормы появятся после выбора нарушения</div>
    <label>ФИО инспектора <input id="iname" placeholder="Иванов И. И."></label>
    <label>Должность <input id="ipos" placeholder="Инспектор ЦОБ"></label>
  </div>
  <button class="btn ghost" id="draft">Сохранить черновик</button>
  <button class="btn" id="make">Сформировать акт</button>
  <button class="btn ghost" id="reset">Очистить форму</button>
  <p id="msg"></p>
</section>

<section class="card"><h2>Последние 10 актов</h2>
  <table id="hist"><thead><tr><th>Дата</th><th>Время</th><th>Номер</th><th>Нарушение</th><th>Статус</th><th></th></tr></thead><tbody></tbody></table>
</section>
</main>
<script src="app.js"></script></body></html>
